<div class="form-container">

    <h2>Ny bok</h2>

    <form>
        <label for="title">Titel</label>
        <input type="text" id="title" placeholder="Skriv bokens titel">

        <label for="author">Författare</label>
        <input type="text" id="author" placeholder="Skriv bokens författare">

        <label for="publication_date">Publiceringsdatum</label>
        <input type="date" id="publication_date" placeholder="Skriv bokens publiceringsdatum">

        <button type="submit">Skapa</button>
    </form>
</div>
