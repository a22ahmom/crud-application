<h1>Min boksamling</h1>

<div class="container">
    <button routerLink="/books/new">
        Lägg till ny bok
    </button>
</div>

<h2>Mina böcker</h2>

<div class="book-list">
    @for (book of bookService.books; track $index) {

    <div class="book-item">
        <div class="book-info">

            <h3>{{ book.title }}</h3>

            <p>
                <strong>
                    Författare: {{ book.author }}
                </strong>
            </p>

            <p>
                <strong>
                    Publicerad: {{ book.publicationDate }}
                </strong>
            </p>
        </div>
    </div>
    }
</div>
