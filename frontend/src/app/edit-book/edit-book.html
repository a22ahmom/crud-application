<h1>Redigera bok</h1>

<form (ngSubmit)="saveBook()" class="form">

    <div class="form-group">
        <label for="title">Titel</label>

        <input 
            type="text" 
            id="title" 
            name="title" 
            [(ngModel)]="title">
    </div>

    <div class="form-group">
        <label for="author">Författare</label>

        <input 
            type="text" 
            id="author" 
            name="author" 
            [(ngModel)]="author">
    </div>

    <div class="form-group">
        <label for="publicationDate">Publiceringsdatum</label>

        <input 
            type="date" 
            id="publicationDate" 
            name="publicationDate" 
            [(ngModel)]="publicationDate">
    </div>

    <button type="submit">Spara ändringar</button>

</form>
