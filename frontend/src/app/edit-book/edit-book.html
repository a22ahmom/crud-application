<h1>Redigera bok</h1>

<form (ngSubmit)="saveBook()" class="form">

    <div class="mb-3">
        <label class="form-label" for="title">Titel</label>

        <input 
            class="form-control"
            type="text" 
            id="title" 
            name="title" 
            [(ngModel)]="title">
    </div>

    <div class="mb-3">
        <label class="form-label" for="author">Författare</label>

        <input 
            class="form-control"
            type="text" 
            id="author" 
            name="author" 
            [(ngModel)]="author">
    </div>

    <div class="mb-3">
        <label class="form-label" for="publicationDate">Publiceringsdatum</label>

        <input 
            class="form-control"
            type="date" 
            id="publicationDate" 
            name="publicationDate" 
            [(ngModel)]="publicationDate">
    </div>

    <button class="btn btn-primary" type="submit">
        
        <i class="fa-solid fa-floppy-disk me-1"></i>
        Spara ändringar
    </button>

</form>
