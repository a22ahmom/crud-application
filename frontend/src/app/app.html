<nav class="navbar">

    <div class="navbar-inner">

        <span class="brand">
            Bokappen
        </span>

        @if (authService.isLoggedIn()) {

            <button
                class="menu-button"
                type="button"
                (click)="toggleMenu()"
                aria-label="Öppna meny">
                ☰
            </button>

            <div
                class="nav-links"
                [class.open]="menuOpen">

                <a
                    routerLink="/books"
                    routerLinkActive="active"
                    (click)="closeMenu()">
                    Mina böcker
                </a>

                <a
                    routerLink="/quotes"
                    routerLinkActive="active"
                    (click)="closeMenu()">
                    Mina citat
                </a>

                <button type="button" (click)="logout()">
                    Logga ut
                </button>
            </div>
        } @else {
            <div class="nav-links guest-links">

                <a
                    routerLink="/login"
                    routerLinkActive="active">
                    Logga in
                </a>

                <a
                    routerLink="/register"
                    routerLinkActive="active">
                    Registrera
                </a>
            </div>
        }
    </div>
</nav>

<main class="container">
    <router-outlet />
</main>
