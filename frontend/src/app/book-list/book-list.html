<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

    <h1 class="mb-0">Mina böcker</h1>

    <button class="btn btn-success" routerLink="/books/new">
        
        <i class="fa-solid fa-plus me-2"></i>
        Lägg till ny bok
        
    </button>
</div>

<div class="row g-4">

    @for (book of books; track book.id) {

    <div class="col-12 col-md-6 col-lg-4">

        <div class="card h-100 shadow-sm">

            <div class="card-body d-flex flex-column">

                <h2 class="card-title h5">
                    <i class="fa-solid fa-book me-2"></i>
                    {{ book.title }}
                </h2>

                <p class="card-text">
                    {{ book.author }}
                </p>

                <p class="card-text">
                    {{ book.publicationDate | date:'yyyy-MM-dd' }}
                </p>

                <div class="mt-auto d-flex gap-2 flex-wrap">

                    <button class="btn btn-primary" [routerLink]="['/books/edit', book.id]">
                        <i class="fa-solid fa-pen me-1"></i>
                        Redigera
                    </button>

                    <button class="btn btn-danger" (click)="deleteBook(book.id!)">
                        <i class="fa-solid fa-trash me-1"></i>
                        Radera
                    </button>
                </div>
            </div>
        </div>
    </div>
    }
</div>
