<h1>Min boksamling</h1>

<div class="container">
    <button routerLink="/books/new">
        Lägg till ny bok
    </button>
</div>

<h2>Mina böcker</h2>

<div class="book-list">

    @for (book of books; track book.id) {

    <article class="book-item">

        <h3>{{ book.title }}</h3>

        <p>
            <strong>
                Författare: {{ book.author }}
            </strong>
        </p>

        <p>
            <strong>
                Publicerad: {{ book.publicationDate }}
            </strong>
        </p>

        <div class="actions">
            <button [routerLink]="['/books/edit', book.id]">
                Redigera
            </button>

            <button (click)="deleteBook(book.id!)">
                Radera
            </button>
        </div>

    </article>
    }
</div>

<button (click)="logout()">
    Logga ut
</button>
