<h1>Min boksamling</h1>

<div class="container">
    <button routerLink="/books/new">
        Lägg till ny bok
    </button>
</div>

<h2>Mina böcker</h2>

<div class="row g-4">

    @for (book of books; track book.id) {

    <div class="col-12 col-md-6 col-lg-4">

        <div class="card h-100">

            <div class="card-body">

                <h2 class="card-title h5">
                    <i class="fa-solid fa-book"></i>
                    {{ book.title }}
                </h2>

                <p class="card-text">
                    {{ book.author }}
                </p>

                <p class="card-text">
                    {{ book.publicationDate }}
                </p>

                <div class="d-flex gap-2 flex-wrap">

                    <button class="btn btn-primary" [routerLink]="['/books/edit', book.id]">
                        <i class="fa-solid fa-pen"></i>
                        Redigera
                    </button>

                    <button class="btn btn-danger" (click)="deleteBook(book.id!)">
                        <i class="fa-solid fa-trash"></i>
                        Radera
                    </button>
                </div>
            </div>
        </div>
    </div>
    }
</div>
