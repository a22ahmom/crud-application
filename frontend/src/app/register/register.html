<h1>Registrera användare</h1>

<form (ngSubmit)="register()" class="form">

    <div class="form-group">
        <label for="username">Användarnamn</label>

        <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Lösenord</label>

        <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
        >
    </div>

    <button type="submit">
        Registrera
    </button>
</form>
