<h1>Registrera användare</h1>

<form (ngSubmit)="register()" class="form">

    <div class="form-group">
        <label for="username">Användarnamn</label>

        <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Lösenord</label>

        <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
        >
    </div>

    <div class="form-group">
        <label for="confirmedPassword">
            Bekräfta Lösenord
        </label>

        <input
            id="confirmedPassword"
            type="password"
            name="confirmedPassword"
            [(ngModel)]="confirmedPassword"
            required
        >
    </div>

    @if (errorMessage) {
        <p class="error-message">
            {{ errorMessage }}
        </p>
    }

    <button type="submit">
        Registrera
    </button>
</form>
