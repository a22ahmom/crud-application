<h1>Lägg till citat</h1>

<form (ngSubmit)="addQuote()" class="form">

    <div class="mb-3">
        <label class="form-label" for="text">Citat</label>

        <textarea class="form-control" rows="4" id="text" name="text" [(ngModel)]="text" required>
        </textarea>
    </div>

    <div class="mb-3">
        <label class="form-label" for="author">Författare</label>

        <input class="form-control" id="author" type="text" name="author" [(ngModel)]="author" required>
    </div>

    <button class="btn btn-success" type="submit">

        <i class="fa-solid fa-plus me-1"></i>
        Lägg till citat
    </button>

</form>
