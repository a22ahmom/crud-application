<div class="row justify-content-center align-items-center login-page">

    <div class="col-12 col-md-8 col-lg-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h1 class="h3 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>
                    Logga in
                </h1>

                <p class="text-muted">

                    Logga in för att hantera dina böcker och citat.

                </p>

                <form (ngSubmit)="login()">

                    <div class="mb-3">
                        <label class="form-label" for="username">Användarnamn</label>

                        <input class="form-control" id="username" type="text" name="username" [(ngModel)]="username"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Lösenord</label>

                        <input class="form-control" id="password" type="password" name="password" [(ngModel)]="password"
                            required>
                    </div>

                    @if (errorMessage) {
                    <div class="alert alert-danger">
                        {{ errorMessage }}
                    </div>
                    }

                    <button class="btn btn-primary w-100" type="submit">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>
                        Logga in
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
