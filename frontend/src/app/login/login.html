<h1>Logga in</h1>

<form (ngSubmit)="login()">

    <div>
        <label for="username">Användarnamn</label>

        <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            required
        >
    </div>

    <div>
        <label for="password">Lösenord</label>

        <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
        >
    </div>

    <button type="submit">
        Logga in
    </button>
</form>
