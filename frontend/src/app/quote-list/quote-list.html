<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

    <h1 class="mb-0">Mina citat</h1>

    <button class="btn btn-success" routerLink="/quotes/new">
        
        <i class="fa-solid fa-plus me-2"></i>
        Lägg till nytt citat

    </button>

</div>

<div class="row g-4">

    @for (quote of quotes; track quote.id) {

    <div class="col-12 col-md-6 col-lg-4">

        <div class="card h-100 shadow-sm">

            <div class="card-body d-flex flex-column">

                <i class="fa-solid fa-quote-left fa-lg mb-3"></i>

                <blockquote class="blockquote">
                    {{ quote.text }}
                </blockquote>

                <p class="text-muted">
                    — {{ quote.author }}
                </p>

                <div class="mt-auto d-flex gap-2 flex-wrap">

                    <button class="btn btn-primary" [routerLink]="['/quotes/edit', quote.id]">
                        <i class="fa-solid fa-pen me-1"></i>
                        Redigera
                    </button>

                    <button class="btn btn-danger" (click)="deleteQuote(quote.id!)">
                        <i class="fa-solid fa-trash me-1"></i>
                        Radera
                    </button>
                </div>
            </div>
        </div>
    </div>
    }
</div>
