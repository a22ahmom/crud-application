<div class="form-container">

    <h2>Ny bok</h2>

    <form (ngSubmit)="addBook()">

        <div class="mb-3">
            <label class="form-label" for="title">Titel</label>

            <input 
                class="form-control"
                type="text" 
                id="title" 
                name="title" 
                [(ngModel)]="title" 
                placeholder="Skriv bokens titel">
        </div>

        <div class="mb-3">
            <label class="form-label" for="author">Författare</label>

            <input 
                class="form-control"
                type="text" 
                id="author" 
                name="author" 
                [(ngModel)]="author" 
                placeholder="Skriv bokens författare">
        </div>

        <div class="mb-3">
            <label class="form-label" for="publicationDate">Publiceringsdatum</label>

            <input 
                class="form-control"
                type="date" 
                id="publicationDate" 
                name="publicationDate" 
                [(ngModel)]="publicationDate"
                placeholder="Skriv bokens publiceringsdatum">
        </div>

        <button class="btn btn-primary" type="submit">Skapa</button>
    </form>
</div>
