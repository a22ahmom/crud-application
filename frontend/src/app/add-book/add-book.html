<div class="form-container">

    <div class="mb-4">

        <h1 class="display-6 fw-bold">
            <i class="fa-solid fa-book-open me-2"></i>
            Ny bok
        </h1>

        <p class="text-muted">
            Lägg till en ny bok i din samling.
        </p>

    </div>


    <form (ngSubmit)="addBook()">

        <div class="mb-3">
            <label class="form-label" for="title">Titel</label>

            <input class="form-control" type="text" id="title" name="title" [(ngModel)]="title"
                placeholder="Skriv bokens titel">
        </div>

        <div class="mb-3">
            <label class="form-label" for="author">Författare</label>

            <input class="form-control" type="text" id="author" name="author" [(ngModel)]="author"
                placeholder="Skriv bokens författare">
        </div>

        <div class="mb-3">
            <label class="form-label" for="publicationDate">Publiceringsdatum</label>

            <input class="form-control" type="date" id="publicationDate" name="publicationDate"
                [(ngModel)]="publicationDate" placeholder="Skriv bokens publiceringsdatum">
        </div>

        <button class="btn btn-primary" type="submit">
            Skapa
        </button>
    </form>
</div>
