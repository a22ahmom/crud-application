<div class="form-container">

    <h2>Ny bok</h2>

    <form (ngSubmit)="addBook()" class="form">

        <div class="form-group">
            <label for="title">Titel</label>

            <input 
                type="text" 
                id="title" 
                name="title" 
                [(ngModel)]="title" 
                placeholder="Skriv bokens titel">
        </div>

        <div class="form-group">
            <label for="author">Författare</label>

            <input 
                type="text" 
                id="author" 
                name="author" 
                [(ngModel)]="author" 
                placeholder="Skriv bokens författare">
        </div>

        <div class="form-group">
            <label for="publicationDate">Publiceringsdatum</label>

            <input 
                type="date" 
                id="publicationDate" 
                name="publicationDate" 
                [(ngModel)]="publicationDate"
                placeholder="Skriv bokens publiceringsdatum">
        </div>

        <button type="submit">Skapa</button>
    </form>
</div>
